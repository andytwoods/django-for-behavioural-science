
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flanker task</title>

    
    <link rel="stylesheet" href="jspsych/jspsych.css">
    
    <script src="jspsych/jspsych.js"></script>
    
    
    <script src="jspsych/plugin-html-keyboard-response.js"></script>
    
</head>
<body>
<script>
    // --- The data-capture plumbing the *platform* provides --------------------
    // The researcher supplies only their experiment logic (Study.code, injected
    // below); everything around it – initialising jsPsych and, later, posting the
    // data back to Django – is the platform's job. This is the tutorial's thesis in
    // code: "the platform provides the plumbing; the researcher provides the experiment."
    // Django's CSRF token, rendered into the page so the same-origin POST below
    // can send it in the X-CSRFToken header (see the submit_data view).
    const CSRF_TOKEN = "";
    const DATA_URL = "/api/study/flanker/data";
    // Where to send the participant once their data is saved, e.g. the Prolific completion
    // URL that records their submission as complete. Blank when the study doesn't need one.
    const COMPLETION_URL = "";
    // Preview mode (?preview=1 in the URL): run the study but save nothing, so a study can
    // be tried without polluting the data. The server reads the flag; we just obey it.
    const PREVIEW = true;
    // Participant identity comes from the server (read from the URL query params),
    // not from the front-end parsing the URL itself. escapejs escapes the value for a
    // JavaScript string, so a participant can't smuggle code onto the page via their ID.
    const PARTICIPANT_ID = "";
    const CONDITION = "";

    if (PREVIEW) {
        // Make it obvious throughout the run that nothing is being stored.
        const banner = document.createElement("div");
        banner.textContent = "Preview mode — this run won't be saved to the platform database";
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;padding:4px;" +
            "text-align:center;font:14px sans-serif;background:#fee;color:#900;";
        document.body.appendChild(banner);
    }

    // Post the collected trials to Django, and only tell the participant their data
    // is safe once the server confirms it. A study runs once; if the save silently
    // fails we cannot get the data back, so we wait for the response, check it
    // succeeded, and offer a retry if it did not.
    function saveData() {
        const message = html => document.body.innerHTML =
            "<div style='text-align:center;margin-top:3em;'>" + html + "</div>";
        if (PREVIEW) {
            // Preview run: never POST, so nothing is stored in the platform database.
            message("<p>Preview finished. This run was <b>not</b> saved to the platform database.</p>");
            return Promise.resolve();
        }
        const body = JSON.stringify({
            participant_id: PARTICIPANT_ID,
            condition: CONDITION,
            trials: jsPsych.data.get().values()
        });
        message("<p>Saving your data, please don't close this window...</p>");
        return fetch(DATA_URL, {
            method: "POST",
            mode: "same-origin",                          // don't send the CSRF token off-origin
            headers: {"Content-Type": "application/json", "X-CSRFToken": CSRF_TOKEN},
            body: body
        })
            .then(response => {
                if (!response.ok) throw new Error("HTTP " + response.status);  // 4xx/5xx isn't success
                return response.json();
            })
            .then(result => {
                if (COMPLETION_URL) {
                    // Data is saved: send them back to Prolific so their submission is
                    // recorded as complete. Confirm first, then auto-redirect (Prolific's
                    // recommended default, avoids a "NOCODE" submission if they close the
                    // tab), with a fallback link in case the redirect is blocked.
                    message("<p>Data saved. Returning you to Prolific…</p>" +
                        "<p>If you're not redirected, <a href='" + COMPLETION_URL +
                        "'>click here to finish</a>.</p>");
                    setTimeout(function () { window.location = COMPLETION_URL; }, 1500);
                } else {
                    message("<p>Thank you, your data has been saved.</p>");
                }
            })
            .catch(error => {
                // Network dropped or the server errored: keep the data in the page and
                // let the participant retry rather than losing the session.
                message("<p>Sorry, saving failed.</p>" +
                    "<button onclick='saveData()'>Try again</button>");
            });
    }

    const jsPsych = jsPsychModule.initJsPsych({
        on_finish: saveData   // when the timeline ends, save (and confirm) the data
    });

    // The researcher's pasted code pushes trials onto this array. The available
    // building blocks (`jsPsych`, `timeline`, and the loaded plugins) are the
    // platform's contract with the experiment.
    let timeline = [];

    // --- Injected researcher code (Study.code) --------------------------------
    // It isn't sandboxed: this is the researcher's own code, served to their own
    // participants, which is why only staff can create or edit a study.
    // Minimal Flanker task: respond to the CENTRE arrow (f = left, j = right).
// This is a jsPsych timeline. Paste it into a new study's "code" field in the admin.
// (The finished app also loads it for you, in a seed migration.)
const fixation = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '<p style="font-size:48px;">+</p>',
  choices: "NO_KEYS",
  trial_duration: 500
};

const flanker = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: jsPsych.timelineVariable('stimulus'),
  choices: ['f', 'j'],
  data: {
    congruency: jsPsych.timelineVariable('congruency'),
    correct_response: jsPsych.timelineVariable('correct_response')
  },
  on_finish: function (data) {
    data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
  }
};

const instructions = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '<p>Press <b>f</b> if the CENTRE arrow points left, <b>j</b> if it points right.</p>' +
            '<p>Press any key to begin.</p>'
};

timeline.push(instructions);
timeline.push({
  timeline: [fixation, flanker],
  timeline_variables: [
    { stimulus: '<p style="font-size:48px;letter-spacing:8px;">&lt;&lt;&lt;&lt;&lt;</p>', congruency: 'congruent',  correct_response: 'f' },
    { stimulus: '<p style="font-size:48px;letter-spacing:8px;">&gt;&gt;&gt;&gt;&gt;</p>', congruency: 'congruent',  correct_response: 'j' },
    { stimulus: '<p style="font-size:48px;letter-spacing:8px;">&gt;&gt;&lt;&gt;&gt;</p>', congruency: 'incongruent', correct_response: 'f' },
    { stimulus: '<p style="font-size:48px;letter-spacing:8px;">&lt;&lt;&gt;&lt;&lt;</p>', congruency: 'incongruent', correct_response: 'j' }
  ],
  randomize_order: true,
  repetitions: 2
});

    // --- End injected code ----------------------------------------------------

    jsPsych.run(timeline);
</script>
</body>
</html>
